<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 400' width='1200' height='400' fill='none' role='img' aria-label='Deni Purwanto - Frontend or Full Stack Engineer'>
<desc>Cyber-neon banner for Deni Purwanto</desc>
<defs>
<radialGradient id='bg' cx='50%' cy='40%' r='85%'><stop offset='0' stop-color='#1a1050'/><stop offset='.45' stop-color='#0b0820'/><stop offset='1' stop-color='#04030a'/></radialGradient>
<radialGradient id='o1'><stop offset='0' stop-color='#7b5cff' stop-opacity='.6'/><stop offset='1' stop-color='#7b5cff' stop-opacity='0'/></radialGradient>
<radialGradient id='o2'><stop offset='0' stop-color='#00ffa3' stop-opacity='.35'/><stop offset='1' stop-color='#00ffa3' stop-opacity='0'/></radialGradient>
<radialGradient id='o3'><stop offset='0' stop-color='#7df9ff' stop-opacity='.4'/><stop offset='1' stop-color='#7df9ff' stop-opacity='0'/></radialGradient>
<linearGradient id='nameGrad' gradientUnits='userSpaceOnUse' x1='330' y1='0' x2='870' y2='0' spreadMethod='repeat'><stop offset='0' stop-color='#ffffff'/><stop offset='.3' stop-color='#7df9ff'/><stop offset='.6' stop-color='#a78bfa'/><stop offset='1' stop-color='#ffffff'/><animateTransform attributeName='gradientTransform' type='translate' from='0 0' to='540 0' dur='6s' repeatCount='indefinite'/></linearGradient>
<linearGradient id='borderGrad' gradientUnits='userSpaceOnUse' x1='0' y1='0' x2='600' y2='0' spreadMethod='repeat'><stop offset='0' stop-color='#7df9ff'/><stop offset='.5' stop-color='#7b5cff'/><stop offset='1' stop-color='#7df9ff'/><animateTransform attributeName='gradientTransform' type='translate' from='0 0' to='600 0' dur='5s' repeatCount='indefinite'/></linearGradient>
<linearGradient id='shine' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#fff' stop-opacity='0'/><stop offset='.5' stop-color='#fff' stop-opacity='.95'/><stop offset='1' stop-color='#fff' stop-opacity='0'/></linearGradient>
<linearGradient id='lineFade' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#7df9ff' stop-opacity='0'/><stop offset='.5' stop-color='#00ffa3' stop-opacity='1'/><stop offset='1' stop-color='#7b5cff' stop-opacity='0'/></linearGradient>
<linearGradient id='ff' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff' stop-opacity='0'/><stop offset='1' stop-color='#fff' stop-opacity='.9'/></linearGradient>
<mask id='fmask'><rect x='0' y='318' width='1200' height='82' fill='url(#ff)'/></mask>
<clipPath id='tc'><text x='600' y='244' text-anchor='middle' font-family='Inter, Segoe UI, Trebuchet MS, Verdana, sans-serif' font-size='96' font-weight='800' letter-spacing='4'>Deni Purwanto</text></clipPath>
<clipPath id='cl'><rect width='1200' height='400' rx='30'/></clipPath>
<filter id='blur' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='40'/></filter>
<filter id='electric' x='-30%' y='-30%' width='160%' height='160%'><feTurbulence type='fractalNoise' baseFrequency='0.013' numOctaves='2' seed='2' result='n'><animate attributeName='baseFrequency' dur='9s' values='0.012;0.021;0.012' repeatCount='indefinite'/><animate attributeName='seed' dur='3s' values='2;9;4;11;2' calcMode='discrete' repeatCount='indefinite'/></feTurbulence><feDisplacementMap in='SourceGraphic' in2='n' scale='14' xChannelSelector='R' yChannelSelector='G'/></filter>
<filter id='glow' x='-40%' y='-40%' width='180%' height='180%'><feGaussianBlur stdDeviation='4' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
<filter id='textGlow' x='-20%' y='-60%' width='140%' height='220%'><feGaussianBlur stdDeviation='8' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
<style>
.tw{animation:tw 3s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out infinite .6s}.tw3{animation:tw 3.7s ease-in-out infinite 1.1s}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.flick{animation:fl 2.6s steps(1) infinite}.flick2{animation:fl 3.4s steps(1) infinite .8s}
@keyframes fl{0%,7%,12%,100%{opacity:.3}9%,55%{opacity:.06}60%,70%{opacity:.45}}
.float{animation:ft 7s ease-in-out infinite}
@keyframes ft{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pulse{animation:pl 3.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
.g1{animation:g1 5s steps(1) infinite}.g2{animation:g2 5s steps(1) infinite}
@keyframes g1{0%,90%,100%{transform:translate(-2px,0)}91%{transform:translate(-9px,2px)}93%{transform:translate(6px,-2px)}95%{transform:translate(-4px,1px)}97%{transform:translate(-2px,0)}}
@keyframes g2{0%,90%,100%{transform:translate(2px,0)}91%{transform:translate(9px,-2px)}93%{transform:translate(-6px,2px)}95%{transform:translate(4px,-1px)}97%{transform:translate(2px,0)}}
</style>
</defs>
<g clip-path='url(#cl)'>
<rect width='1200' height='400' fill='url(#bg)'/>
<g filter='url(#blur)'>
<circle cx='260' cy='110' r='170' fill='url(#o1)'><animateTransform attributeName='transform' type='translate' values='0 0;80 40;0 0' dur='13s' repeatCount='indefinite'/></circle>
<circle cx='960' cy='120' r='190' fill='url(#o3)'><animateTransform attributeName='transform' type='translate' values='0 0;-70 50;0 0' dur='16s' repeatCount='indefinite'/></circle>
<circle cx='620' cy='400' r='200' fill='url(#o2)'><animateTransform attributeName='transform' type='translate' values='0 0;-90 -20;0 0' dur='11s' repeatCount='indefinite'/></circle>
</g>
<g mask='url(#fmask)' stroke='#7df9ff' stroke-opacity='.45' stroke-width='1'>
<path d='M600 318L600 400M600 318L450 400M600 318L750 400M600 318L300 400M600 318L900 400M600 318L100 400M600 318L1100 400M600 318L-150 400M600 318L1350 400M600 318L-500 400M600 318L1700 400M600 318L-1000 400M600 318L2200 400'/>
<rect x='0' y='322' width='1200' height='1' fill='#7df9ff' stroke='none'><animate attributeName='y' values='322;398' dur='3.2s' keySplines='.55 0 1 1' keyTimes='0;1' calcMode='spline' repeatCount='indefinite'/></rect>
<rect x='0' y='322' width='1200' height='1' fill='#7df9ff' stroke='none'><animate attributeName='y' values='322;398' dur='3.2s' begin='-.8s' keySplines='.55 0 1 1' keyTimes='0;1' calcMode='spline' repeatCount='indefinite'/></rect>
<rect x='0' y='322' width='1200' height='1' fill='#7df9ff' stroke='none'><animate attributeName='y' values='322;398' dur='3.2s' begin='-1.6s' keySplines='.55 0 1 1' keyTimes='0;1' calcMode='spline' repeatCount='indefinite'/></rect>
<rect x='0' y='322' width='1200' height='1' fill='#7df9ff' stroke='none'><animate attributeName='y' values='322;398' dur='3.2s' begin='-2.4s' keySplines='.55 0 1 1' keyTimes='0;1' calcMode='spline' repeatCount='indefinite'/></rect>
</g>
<g fill='#cfe9ff'>
<circle class='tw' cx='90' cy='70' r='1.6'/><circle class='tw2' cx='300' cy='86' r='1.9'/><circle class='tw3' cx='560' cy='64' r='1.4'/><circle class='tw' cx='840' cy='96' r='1.3'/><circle class='tw2' cx='1100' cy='78' r='1.7'/><circle class='tw3' cx='180' cy='200' r='1.5'/><circle class='tw' cx='1040' cy='200' r='1.4'/><circle class='tw2' cx='60' cy='208' r='1.2'/><circle class='tw3' cx='1150' cy='250' r='1.5'/><circle class='tw' cx='380' cy='58' r='1.1'/><circle class='tw3' cx='760' cy='56' r='1.2'/>
</g>
<g stroke='#7df9ff' stroke-width='2' fill='none' filter='url(#glow)' stroke-linecap='round' stroke-linejoin='round'>
<path class='flick' d='M120 40 L150 120 L122 132 L168 230 L138 244 L182 340'/>
<path class='flick2' d='M1080 44 L1052 118 L1082 130 L1040 224 L1070 238 L1028 336' stroke='#7b5cff'/>
</g>
<g filter='url(#glow)'><rect x='26' y='26' width='1148' height='348' rx='26' fill='none' stroke='url(#borderGrad)' stroke-width='2.4' filter='url(#electric)'/></g>
<g stroke='#00ffa3' stroke-width='2.4' fill='none' class='pulse' stroke-linecap='round'>
<path d='M54 86 L54 54 L86 54'/><path d='M1146 86 L1146 54 L1114 54'/><path d='M54 314 L54 346 L86 346'/><path d='M1146 314 L1146 346 L1114 346'/>
</g>
<g class='float'>
<text x='600' y='150' text-anchor='middle' font-family='JetBrains Mono, Consolas, Trebuchet MS, sans-serif' font-size='15' letter-spacing='8' fill='#00ffa3' opacity='.92'>&#8249; DENIPURWANTO10 &#8250;</text>
<text class='g1' x='600' y='244' text-anchor='middle' font-family='Inter, Segoe UI, Trebuchet MS, Verdana, sans-serif' font-size='96' font-weight='800' letter-spacing='4' fill='#00f0ff' opacity='.7'>Deni Purwanto</text>
<text class='g2' x='600' y='244' text-anchor='middle' font-family='Inter, Segoe UI, Trebuchet MS, Verdana, sans-serif' font-size='96' font-weight='800' letter-spacing='4' fill='#ff2bd6' opacity='.6'>Deni Purwanto</text>
<text x='600' y='244' text-anchor='middle' font-family='Inter, Segoe UI, Trebuchet MS, Verdana, sans-serif' font-size='96' font-weight='800' letter-spacing='4' fill='url(#nameGrad)' filter='url(#textGlow)'>Deni Purwanto</text>
<g clip-path='url(#tc)'><rect x='-300' y='150' width='260' height='110' fill='url(#shine)' transform='skewX(-20)'><animate attributeName='x' values='-300;1300' dur='5s' repeatCount='indefinite'/></rect></g>
<rect x='350' y='268' width='500' height='2.6' rx='1.3' fill='url(#lineFade)'/>
<text x='600' y='312' text-anchor='middle' font-family='Inter, Segoe UI, Trebuchet MS, Verdana, sans-serif' font-size='18' letter-spacing='6' fill='#cfeaff' opacity='.95'>Frontend or Full Stack Engineer</text>
</g>
</g>
</svg>
