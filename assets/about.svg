<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none" role="img" aria-label="About Deni Purwanto: Bachelor of Informatics Engineering at Universitas Langlangbuana. Passionate about Web Development and Mobile Development. Based in Bandung, Indonesia. Concerned with secure, scalable, and maintainable code.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120c34"/>
      <stop offset="1" stop-color="#06040d"/>
    </linearGradient>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#7df9ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace; }
      .sans { font-family: 'Trebuchet MS','Segoe UI',Verdana,sans-serif; }
      .chip { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .txt  { font-size: 25px; fill: #cfe3ff; }
      .hl   { font-weight: 800; fill: #7df9ff; }
      .hg   { font-weight: 800; fill: #00ffa3; }
      .hp   { font-weight: 800; fill: #b9a6ff; }
      .row  { opacity: 0; animation: in 0.7s ease-out forwards; }
      .r1 { animation-delay: .1s } .r2 { animation-delay: .35s } .r3 { animation-delay: .6s } .r4 { animation-delay: .85s }
      @keyframes in { from { opacity: 0; transform: translateX(-18px) } to { opacity: 1; transform: translateX(0) } }
      .cur { animation: bl 1s steps(1) infinite; }
      @keyframes bl { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      .scan { animation: sc 6s linear infinite; }
      @keyframes sc { from { transform: translateY(0) } to { transform: translateY(380px) } }
    </style>
    <clipPath id="c"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect class="scan" y="-40" width="1200" height="40" fill="#7df9ff" opacity="0.04"/>

    <!-- title bar -->
    <rect width="1200" height="56" fill="#0b0820"/>
    <circle cx="36" cy="28" r="7" fill="#ff5c7a"/>
    <circle cx="62" cy="28" r="7" fill="#ffc857"/>
    <circle cx="88" cy="28" r="7" fill="#00ffa3"/>
    <text x="122" y="34" class="mono" font-size="15" fill="#7b8bbd">~/denipurwanto10/about.sh</text>
    <text x="1164" y="34" text-anchor="end" class="mono" font-size="15" fill="#00ffa3">&#9679; online</text>

    <!-- rows -->
    <g class="row r1">
      <rect x="48" y="86" width="190" height="44" rx="10" fill="#7df9ff" fill-opacity="0.10" stroke="#7df9ff" stroke-opacity="0.6"/>
      <text x="143" y="114" text-anchor="middle" class="mono chip" fill="#7df9ff">EDUCATION</text>
      <text x="268" y="116" class="sans txt">Bachelor of <tspan class="hl">Informatics Engineering</tspan> &#8211; Universitas Langlangbuana</text>
    </g>

    <g class="row r2">
      <rect x="48" y="158" width="190" height="44" rx="10" fill="#7b5cff" fill-opacity="0.14" stroke="#9a82ff" stroke-opacity="0.7"/>
      <text x="143" y="186" text-anchor="middle" class="mono chip" fill="#b9a6ff">FOCUS</text>
      <text x="268" y="188" class="sans txt">Passionate about <tspan class="hp">Web Development</tspan> and <tspan class="hp">Mobile Development</tspan></text>
    </g>

    <g class="row r3">
      <rect x="48" y="230" width="190" height="44" rx="10" fill="#00ffa3" fill-opacity="0.10" stroke="#00ffa3" stroke-opacity="0.6"/>
      <text x="143" y="258" text-anchor="middle" class="mono chip" fill="#00ffa3">LOCATION</text>
      <text x="268" y="260" class="sans txt">Based in <tspan class="hg">Bandung, Indonesia</tspan></text>
    </g>

    <g class="row r4">
      <rect x="48" y="302" width="190" height="44" rx="10" fill="#ffc857" fill-opacity="0.10" stroke="#ffc857" stroke-opacity="0.6"/>
      <text x="143" y="330" text-anchor="middle" class="mono chip" fill="#ffc857">PRINCIPLE</text>
      <text x="268" y="332" class="sans txt">Concerned with <tspan class="hl">secure, scalable, and maintainable</tspan> code</text>
      <rect class="cur" x="1010" y="312" width="12" height="26" fill="#7df9ff"/>
    </g>
  </g>

  <!-- electric border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="23" stroke="url(#bd)" stroke-width="2.4" filter="url(#glow)"/>
</svg>
