<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#7df9ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm"><rect width="1200" height="40" fill="url(#fade)"/></mask>
    <filter id="gl" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="40"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g mask="url(#fm)">
    <line x1="40" y1="20" x2="1160" y2="20" stroke="#7b5cff" stroke-opacity=".22" stroke-width="8" stroke-linecap="round"/>
    <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#dg)" stroke-width="1.6" stroke-linecap="round" filter="url(#gl)"/>
  </g>
  <g filter="url(#gl)">
    <rect x="588" y="14" width="24" height="12" rx="6" fill="#0b0820" stroke="#7df9ff" stroke-width="1.4"/>
    <circle cx="600" cy="20" r="2.6" fill="#00ffa3"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="3" cy="20" fill="#fff"><animate attributeName="cx" values="80;1120;80" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/><animate attributeName="opacity" values="0;1;1;0;1;1;0" dur="7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
