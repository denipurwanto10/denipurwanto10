<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#7df9ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm"><rect x="0" y="0" width="1200" height="40" fill="url(#fade)"/></mask>
    <filter id="dgl" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="40">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#fm)" filter="url(#dgl)">
    <line x1="40" y1="20" x2="1160" y2="20" stroke="#7b5cff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
    <line x1="40" y1="20" x2="1160" y2="20" stroke="url(#dg)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g fill="#00ffa3" filter="url(#dgl)">
    <path d="M40 20 l8 -6 l8 6 l-8 6 z" opacity="0.9"/>
    <path d="M1160 20 l-8 -6 l-8 6 l8 6 z" opacity="0.9"/>
  </g>
  <g filter="url(#dgl)">
    <path d="M600 10 l10 10 l-10 10 l-10 -10 z" fill="#0b0820" stroke="#7df9ff" stroke-width="1.6"/>
    <path d="M600 15 l5 5 l-5 5 l-5 -5 z" fill="#00ffa3">
      <animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M566 20 l5 -4 l5 4 l-5 4 z" fill="#7b5cff"/>
    <path d="M624 20 l5 -4 l5 4 l-5 4 z" fill="#7b5cff"/>
  </g>
  <g filter="url(#dgl)">
    <circle r="4" cy="20" fill="#7df9ff">
      <animate attributeName="cx" values="60;1140;60" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
    <circle r="2" cy="20" fill="#fff">
      <animate attributeName="cx" values="60;1140;60" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </circle>
  </g>
</svg>
