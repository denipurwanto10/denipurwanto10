name: Update weather banner

on:
  schedule:
    - cron: "17 * * * *"  # target tiap 1 jam, menit ke-17 (GitHub tidak menjamin tepat waktu)
  push:
    paths:
      - "scripts/update_banner.py"
      - ".github/workflows/update-banner.yml"
  workflow_dispatch:         # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: update-banner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate banner
        run: python scripts/update_banner.py assets/bandung-night.svg
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bandung-night.svg
          git commit -m "chore: update weather banner"
          git pull --rebase origin main
          git push
