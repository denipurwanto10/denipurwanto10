name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: denipurwanto10
          output-path: 'game.gif'
          strategy: 'random'

      - name: Recolor game (yellow blocks, red ship)
        run: |
          python -m pip install --quiet pillow numpy
          python scripts/recolor_game.py game.gif

      - name: Commit recolored GIF
        run: |
          if git diff --quiet -- game.gif; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.gif
          git commit -m "chore: recolor space shooter game"
          git pull --rebase origin main
          git push
